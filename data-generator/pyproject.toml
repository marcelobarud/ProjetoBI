[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbi-generator"
version = "0.1.0"
description = "Deterministic synthetic master and transactional data generator for ProjetoBI"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "Faker>=30,<40",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
projectbi-generator = "projectbi_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the approved local PostgreSQL database"]
